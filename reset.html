<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Falcon City | پاک‌سازی کش</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0404;color:#f3e9e4;font-family:Tahoma,Vazirmatn,sans-serif;text-align:center;padding:24px}
h2{margin:0 0 10px}p{opacity:.8;margin:8px 0}a{color:#ff6b35}
</style>
</head>
<body>
<div>
  <h2 id="t">در حال پاک‌سازی کش اپ...</h2>
  <p id="s">لطفاً چند ثانیه صبر کن</p>
  <p><a href="./">رفتن به اپ</a></p>
</div>
<script>
(function(){
  /* فقط سرویس‌ورکر و کش اپ پاک می‌شود. ورود و تنظیمات کاربر دست نمی‌خورد. */
  var jobs=[];
  try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}))}catch(e){}
  try{if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}))}catch(e){}
  Promise.all(jobs.map(function(p){return p.catch(function(){})})).then(function(){
    document.getElementById('t').textContent='✅ انجام شد';
    document.getElementById('s').textContent='در حال بازگشت به اپ...';
    setTimeout(function(){location.replace('./')},1200);
  });
})();
</script>
</body>
</html>
